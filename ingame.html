<div id="ingame-scene">

    <!-- 1. TABLA DE CLASIFICACIÓN (Hall of Fame) -->
    <div id="leaderboard-panel" class="hidden">
        <div class="lb-header">HALL OF FAME</div>
        <div id="lb-list"></div>
    </div>

    <!-- 2. SISTEMA DE ANUNCIOS (!anuncio) -->
    <div id="announcement-track"></div>

    <!-- 3. MARCO DE CÁMARA (Esquina Derecha - 16:9) + ZONA PEEK CON WEBKIT MASK -->
    <div id="camera-wrapper">
        <div id="cam-peek-mask">
            <div id="cam-peek-actor">
                <div class="peek-badge" id="peek-badge">!LURK</div>
                <div class="peek-user" id="peek-user">Username</div>
                <img id="peek-img" src="" alt="Uma Peek">
            </div>
        </div>

        <div id="camera-frame">
            <div class="cam-label">MIXXOSHU</div>
        </div>
    </div>

    <!-- 4. ESCENARIO SOUNDALERTS / TTS (Abajo a la Derecha) -->
    <div id="tts-stage">
        <div id="tts-actor">
            <div class="tts-bubble" id="tts-bubble">
                <div class="tts-author" id="tts-author">Usuario</div>
                <div class="tts-text" id="tts-text">Mensaje de voz...</div>
            </div>
            <img id="tts-img" src="" alt="TTS Runner">
        </div>
    </div>

    <!-- 5. MINIJUEGO DE CARRERA IN-GAME -->
    <div id="ingame-race-wrapper" class="hidden">
        <div id="race-hud">
            <div id="race-status-title">¡CARRERA ABIERTA!</div>
            <div id="race-status-sub">Escribe <span class="cmd-highlight">!p 100</span> para entrar</div>
            <div id="race-pot">POZO: 0 PTS</div>
            <div id="race-timer">00:35</div>
        </div>

        <div id="ingame-track">
            <div id="ingame-start-line"></div>
            <div id="race-countdown-banner"></div>
            <div id="ingame-runners-container"></div>
            <div id="ingame-finish-line"></div>
        </div>
    </div>

</div>
